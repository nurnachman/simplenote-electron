name: macOS Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npx electron-builder --mac --publish never
        env:
          SKIP_MACOS_NOTARIZATION: 'true'
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME"
          release/Simplenote-macOS-*.dmg
          release/Simplenote-macOS-*.zip
          --title "Simplenote $GITHUB_REF_NAME"
          --notes "Unsigned universal macOS build. Requires macOS 10.15 or later."
